# 第3章蒸馏: 在 DACO 压缩轨迹上实跑(用于验证特征层/ref 位真的生效)
#
# 与 compare_resnet20.yaml 的唯一差别:
#   1) 只跑 daco 一侧(distill 只挂在 daco 的 joint 段, baseline 保持纯 GETA)
#   2) joint 段缩短到 5(默认 85 太长), 但仍保留 15 warmup —— 必须有热身前段的
#      ckpt 落盘, T_hist 才建得起来, 特征层与 ref 位才有教师可用
#   3) ckpt_every=5, 让 ep5/ep10/ep15 成为可选的历史教师
#
# 用法: python train.py configs/distill_daco_cifar10.yaml
# 覆盖: python train.py configs/distill_daco_cifar10.yaml \
#         --set-distill "decision.severity=heavy" "feature.budget=uniform"

model: resnet20
modes: daco
quant_mode: weight_and_activation

epochs: 10             # joint; 与 warmup 15 合计 25(渐进调度, 避免 5 期一次剪太多)
warmup_epochs: 15
seed: 1
deterministic: false
lr: 0.001
lr_eta_min_ratio: 0.01
variant: adam

dataset:
  data_dir: datasets/cifar10
  batch_size: 128
  num_workers: 4
  eval_batch_size: 256
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
  augmentation:
    random_crop_padding: 4
    random_horizontal_flip: true

optimizer:
  lr_quant: 0.001
  weight_decay: 0.0001
  importance_criteria: default
  projection_periods: 1
  projection_steps: 1
  pruning_steps: 1

prototypes:
  max_samples: 2000

debug:
  random_data: false
  quick_test: false
  legacy_data: false

out: outputs/distill_gradual
ckpt_every: 5

prune_shape: cosine
prune_floor: 0.0
prune_budget: fixed

logging:
  level: info

compression:
  target_group_sparsity: 0.5
  bit_reduction: 1
  min_bit_wt: 4
  max_bit_wt: 16
  min_bit_act: 2
  max_bit_act: 16
  phi_b_threshold: 0.9
  phi_a_threshold: 0.9
  kappa: 0.5
  W: 10
  beta_p: 1.0
  diffusion_noise_init: 0.0001
  diffusion_noise_ratio: 0.5

# ===== 蒸馏开关组(配置 B: 六机制全开) =====
distill:
  enabled: true

  teacher:
    source: trajectory
    hist:
      enabled: true
      max_count: 2
      require_warmup_mid: true
      coordinate: compression
      admit_acc_delta: 0.02
      weight: ib
    cf:
      enabled: true
      implement: shadow
      views: 2

  decision:
    enabled: true
    group_size: 8
    augment_modes: [identity, crop, flip, color, cutout, rotate]
    severity: mid
    reward:
      correctness: true
      teacher_agreement: 1.0
      clean_consistency: 0.5
    advantage:
      normalize_std: false
      mode: positive
    ref_kl:
      enabled: true
      beta: 0.03
      views: clean

  feature:
    enabled: true
    taps: [layer2, layer3, avg_pool]
    pick: fixed
    divergence: forward
    budget: sensitivity
    alpha: 1.0

  weight:
    enabled: true
    epsilon0: 0.01
    kappa: 1.0
    schedule: tighten
    anchor: pre_compression

  # 剪枝事件后蒸馏强度 0->1 线性升. 实测事件处理(ep17 step0)三项 KL 同时涨
  # 3~6 倍(ref_kl 0.18->0.49, feat_layer3 0.10->0.65), 一步到位会把恢复打乱.
  ramp:
    enabled: true
    steps: 20

  diagnostics:
    effective_rank:
      enabled: true
      p_star: 0.9
      every_steps: 50
