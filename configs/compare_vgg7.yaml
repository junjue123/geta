# Baseline(纯 GETA, 阶梯剪枝) vs DACO(余弦剪枝) 正式对比配置 —— VGG-7
#
# 用法:
#   python train.py configs/compare_vgg7.yaml
#   python train.py configs/compare_vgg7.yaml --modes daco        # 只跑一侧
#   python train.py configs/compare_vgg7.yaml --quick-test        # 冒烟
#
# 唯一入口是 train.py; 换模型改 model, 换算法改 modes, 其余全在本文件。

model: vgg7
modes: baseline,daco
quant_mode: weight_and_activation   # 论文对比用 weight_and_activation

# ===== 训练调度 (warmup + joint + cooldown 三段) =====
epochs: 200           # joint 阶段 (剪枝/位宽下降)
warmup_epochs: 10     # 纯 SGD 预热
cooldown_epochs: 20   # 压缩结构固定后只做 finetune
seed: 1
deterministic: false
lr: 0.001
lr_eta_min_ratio: 0.01   # 余弦终点 = lr*0.01 = 1e-5; 设 1.0 会让退火失效
variant: adam            # 必须 adam: 量化参数梯度量级 ~1e9, sgd 会一步爆炸

# ===== 数据 =====
dataset:
  data_dir: datasets/cifar10
  batch_size: 128
  num_workers: 4
  eval_batch_size: 256
  normalization:            # CIFAR-10 统计量
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
  augmentation:
    random_crop_padding: 4
    random_horizontal_flip: true

# ===== 优化器细项 =====
optimizer:
  lr_quant: 0.001         # 量化参数学习率 (d_quant / q_m / t_quant)
  weight_decay: 0.0001
  importance_criteria: default
  projection_periods: 1
  projection_steps: 1
  pruning_steps: 1

# ===== 类别原型 (t-SNE 轨迹用) =====
prototypes:
  max_samples: 2000

# ===== 输出 =====
out: outputs/framework_compare_vgg7
ckpt_every: 10

# ===== 剪枝调度 =====
prune_shape: cosine   # 仅作用于 DACO; baseline 恒为 linear 阶梯
prune_floor: 0.0
prune_budget: fixed   # rcaJS 会让预算被绝对速率覆盖, 形状失效, 勿用

# ===== 日志 =====
logging:
  level: info

# ===== 压缩超参 (对齐 DACO.tex L385-387) =====
compression:
  target_group_sparsity: 0.5
  bit_reduction: 1
  min_bit_wt: 4
  max_bit_wt: 16
  min_bit_act: 2
  max_bit_act: 16
  phi_b_threshold: 0.9
  phi_a_threshold: 0.9
  kappa: 0.5
  W: 5
  beta_p: 1.0
  diffusion_noise_init: 0.0001
  diffusion_noise_ratio: 0.5

# ===== baseline 关断项 (纯 GETA: 无 RCAJS 自适应 / MCSS / DGD) =====
baseline_override:
  phi_b_threshold: 1.0
  phi_a_threshold: 1.0
  beta_p: 0.0
  kappa: 0.0
  diffusion_noise_init: 0.0
  diffusion_noise_ratio: 0.0
